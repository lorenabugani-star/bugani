<script>
  (() => {
    const slug = new URLSearchParams(location.search).get("p");
    const project = slug && window.BUGANI_PROJECTS ? window.BUGANI_PROJECTS[slug] : null;

    const titleEl = document.getElementById("detail-title");
    const pageTitleEl = document.getElementById("page-title");
    const descEl = document.getElementById("detail-description");
    const tagsEl = document.getElementById("detail-tags");
    const galleryEl = document.getElementById("detail-gallery");
    const bannerEl = document.getElementById("detail-banner");

    if (!project) {
      titleEl.textContent = "Projeto não encontrado";
      descEl.textContent = "Volte ao portfólio e escolha um projeto na lista.";
      return;
    }

    document.title = `${project.title} — Bugani`;
    pageTitleEl.textContent = `${project.title} — Bugani`;
    titleEl.textContent = project.title;
    descEl.textContent = project.description || "";

    bannerEl.dataset.ytId = project.bannerYt || "";
    bannerEl.dataset.ytTitle = project.title;

    (project.tags || []).forEach((tag) => {
      const span = document.createElement("span");
      span.textContent = tag;
      tagsEl.appendChild(span);
    });

    (project.gallery || []).forEach((item) => {
      const card = document.createElement("div");
      card.className = "media-card media-card--wide";
      card.dataset.ytId = item.ytId;
      card.dataset.ytTitle = item.title || project.title;
      card.innerHTML = `
        <img class="media-card__thumb" src="https://img.youtube.com/vi/${item.ytId}/hqdefault.jpg" alt="" loading="lazy">
        <span class="media-card__play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="#fff"/></svg></span>
      `;
      galleryEl.appendChild(card);
    });

    document.dispatchEvent(new CustomEvent("bugani:gallery-ready"));
  })();
</script>
<script>
  document.addEventListener("bugani:gallery-ready", () => {
    document.querySelectorAll("#detail-gallery .media-card[data-yt-id]").forEach((card) => {
      if (card.dataset.bound) return;
      card.dataset.bound = "1";
      const id = card.dataset.ytId;
      let frame = null;
      let hideTimer = null;
      const src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&loop=1&playlist=${id}&controls=1&modestbranding=1&playsinline=1&rel=0&iv_load_policy=3`;
      const play = () => {
        if (!id || id.startsWith("VIDEO_ID")) return;
        clearTimeout(hideTimer);
        if (!frame) {
          frame = document.createElement("iframe");
          frame.className = "media-card__frame";
          frame.src = src;
          frame.title = card.dataset.ytTitle || "Vídeo";
          frame.setAttribute("frameborder", "0");
          frame.setAttribute("allow", "autoplay; encrypted-media");
          frame.referrerPolicy = "strict-origin-when-cross-origin";
          card.appendChild(frame);
          requestAnimationFrame(() => frame.classList.add("is-active"));
        }
        card.classList.add("is-playing");
      };
      const stop = () => {
        card.classList.remove("is-playing");
        hideTimer = setTimeout(() => { if (frame) { frame.remove(); frame = null; } }, 200);
      };
      card.addEventListener("mouseenter", play);
      card.addEventListener("mouseleave", stop);
      card.addEventListener("focus", play);
      card.addEventListener("blur", stop);
    });
  });
</script>
